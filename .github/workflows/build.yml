name: Build Shadowsocks Lite Windows 386

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Build
      run: |
        mkdir -p dist
        GOOS=windows GOARCH=386 go build \
          -trimpath -ldflags "-s -w" \
          -o dist/shadowsocks-lite-windows-386.exe \
          main.go
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadowsocks-lite-windows-386
        path: dist/
